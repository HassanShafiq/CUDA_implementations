[build-system]
# The extension is compiled against the PyTorch that is already installed, so build isolation must
# be disabled:  pip install -e . --no-build-isolation
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fused-layernorm"
version = "1.0.0"
description = "Fused LayerNorm CUDA kernels with a PyTorch autograd integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
